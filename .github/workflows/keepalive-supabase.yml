name: Keep-alive Supabase

on:
  schedule:
    # Cada 3 días, bien lejos del límite de 7 días de inactividad del plan free.
    - cron: '23 13 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # Se consulta una tabla real (una fila, una columna): la raíz
        # /rest/v1/ responde 401 solo con la apikey, así que no sirve como
        # ping y hacía fallar el workflow sin que nadie se enterara.
        run: |
          curl -sf -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/negocio_config?select=id&limit=1" -o /dev/null
