name: Keep-alive Supabase

on:
  schedule:
    # Cada 3 días, bien lejos del límite de 7 días de inactividad del plan free.
    - cron: '23 13 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" -o /dev/null
